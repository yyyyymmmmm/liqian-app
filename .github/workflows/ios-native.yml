name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # 扫码随礼配发键注入（v5.12）：ISSUE_KEY 只存 Actions Secret，
      # 构建前生成 GuestSecrets.swift（.gitignore 不入库）——键字节经
      # XOR 掩码＋base64 才落盘，源码与 IPA 里都 grep 不到明文。
      # 无 Secret 的构建（fork 等）生成占位文件，功能降级「暂未开通」。
      - name: Generate guest secrets (ISSUE_KEY, masked)
        env:
          LIQIAN_ISSUE_KEY: ${{ secrets.LIQIAN_ISSUE_KEY }}
        run: python3 scripts/gen-guest-secrets.py

      - name: Assert guest secrets generated (non-placeholder when secret set)
        env:
          LIQIAN_ISSUE_KEY: ${{ secrets.LIQIAN_ISSUE_KEY }}
        run: |
          set -euo pipefail
          test -f Sources/LiqianApp/GuestSecrets.swift
          grep -q "liqian-guest-key-v1" Sources/LiqianApp/GuestSecrets.swift || { echo "ASSERT FAIL: GuestSecrets.swift missing generation marker"; exit 1; }
          if [ -n "${LIQIAN_ISSUE_KEY:-}" ]; then
            grep -q "isPlaceholder = false" Sources/LiqianApp/GuestSecrets.swift || { echo "ASSERT FAIL: guest key is placeholder despite secret present"; exit 1; }
            # 配发键明文不得出现在工作区任何文件里（生成文件是掩码形态，也不例外）
            if grep -rFq "$LIQIAN_ISSUE_KEY" --exclude-dir=.git .; then echo "ASSERT FAIL: plaintext issue key found in workspace"; exit 1; fi
          fi
          echo "guest secrets assertions passed"

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate project
        run: tuist generate --no-open

      - name: SwiftLint
        run: swiftlint lint --quiet || true

      # 侧载机主旗（v5）：本 CI 产物是机主自用侧载包，构建时注入
      # LIQIAN_OWNER_BUILD，EntitlementCenter 据此放行全部 Pro 权益
      # （机主自己的纪念版/汇册/印刷版导出不能被自己的付费墙拦住）。
      # ⚠️ 上架前必须移除：App Store 构建绝不能带此旗，移除步骤见
      # docs/V5-NOTES.md「LIQIAN_OWNER_BUILD」节。
      - name: Build (no codesign)
        run: |
          set -o pipefail
          echo "LIQIAN_OWNER_BUILD=ON (sideload owner build; must NOT ship to App Store)"
          xcodebuild build \
            -project Liqian.xcodeproj \
            -scheme LiqianApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=LIQIAN_OWNER_BUILD \
            | tee build-full.log
          grep -E "error:|warning: .*deprecated|BUILD" build-full.log | head -60 || true

      - name: Unit tests (LiqianCore)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Liqian.xcodeproj \
            -scheme LiqianApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:LiqianCoreTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true

      # 预签（v4.6）：裸包（CODE_SIGNING_ALLOWED=NO）没有任何 entitlements blob，
      # SideStore 的 AltSign 读不到能力声明——不建 App Group、新扩展的 App ID
      # 注册/profile 也容易缺失（v4.5 真机实证：Share 扩展缺有效 profile 导致
      # 整个 App 被系统拒启，官方 issue #1394 同症状）。
      # 这里按 Project.swift 的声明做 ad-hoc 预签（无身份、SideStore 仍会重签），
      # 让 AltSign 能从签名 blob 读到 entitlements 并正确建组/配发。
      # 签完立即断言二进制都带 application-groups，缺失即失败，防假绿。
      # v4.7：appex 改为遍历 PlugIns/*.appex 动态处理——Share 扩展自 v4.7 起
      # 不进包（真机拒启基线，见 docs/V47-NOTES.md），包内 appex 集合会变动，
      # 不再写死名单；断言范围＝主 App＋实际存在的每个 appex 二进制。
      - name: Ad-hoc presign with entitlements (for AltSign)
        env:
          LIQIAN_ISSUE_KEY: ${{ secrets.LIQIAN_ISSUE_KEY }}
        run: |
          set -euo pipefail
          # v5.12 追加断言：GuestSecrets 已生成；Secret 在场时不得是占位
          test -f Sources/LiqianApp/GuestSecrets.swift && grep -q "liqian-guest-key-v1" Sources/LiqianApp/GuestSecrets.swift || { echo "ASSERT FAIL: GuestSecrets.swift not generated"; exit 1; }
          if [ -n "${LIQIAN_ISSUE_KEY:-}" ]; then
            grep -q "isPlaceholder = false" Sources/LiqianApp/GuestSecrets.swift || { echo "ASSERT FAIL: guest key placeholder at presign"; exit 1; }
          fi
          echo "guest secrets presign assertion passed"
          APP=$(find build/dd/Build/Products -name "LiqianApp.app" -type d | head -1)
          test -n "$APP" && test -x "$APP/LiqianApp"
          SIGN_DIR="$RUNNER_TEMP/presign"
          mkdir -p "$SIGN_DIR"
          cat > "$SIGN_DIR/app.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.site.didichou.liqian</string>
              </array>
              <key>aps-environment</key>
              <string>development</string>
              <key>com.apple.developer.icloud-container-identifiers</key>
              <array>
                  <string>iCloud.site.didichou.liqian</string>
              </array>
              <key>com.apple.developer.icloud-services</key>
              <array>
                  <string>CloudKit</string>
              </array>
          </dict>
          </plist>
          EOF
          cat > "$SIGN_DIR/ext.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>group.site.didichou.liqian</string>
              </array>
          </dict>
          </plist>
          EOF
          # 由内向外签：Frameworks → 每个 appex → 主 App（appex 动态遍历）
          for fw in "$APP"/Frameworks/*.framework; do
            codesign --force --sign - "$fw"
          done
          for appex in "$APP"/PlugIns/*.appex; do
            codesign --force --sign - --entitlements "$SIGN_DIR/ext.entitlements" "$appex"
          done
          codesign --force --sign - --entitlements "$SIGN_DIR/app.entitlements" "$APP"
          # 断言：blob 存在且含组声明（App 另须含 iCloud 服务声明）；
          # 二进制名单＝主 App＋每个 appex 的同名主二进制，动态拼装
          BINS=("$APP/LiqianApp")
          for appex in "$APP"/PlugIns/*.appex; do
            BINS+=("$appex/$(basename "$appex" .appex)")
          done
          for bin in "${BINS[@]}"; do
            test -x "$bin" || { echo "ASSERT FAIL: missing binary $bin"; exit 1; }
            OUT=$(codesign -d --entitlements :- "$bin" 2>/dev/null)
            echo "$OUT" | grep -q "com.apple.security.application-groups" || { echo "ASSERT FAIL: no application-groups in $bin"; exit 1; }
            echo "$OUT" | grep -q "group.site.didichou.liqian" || { echo "ASSERT FAIL: no group id in $bin"; exit 1; }
          done
          codesign -d --entitlements :- "$APP/LiqianApp" 2>/dev/null | grep -q "com.apple.developer.icloud-services" || { echo "ASSERT FAIL: no icloud-services in app"; exit 1; }
          echo "presign assertions passed (${#BINS[@]} binaries)"

      - name: Package unsigned IPA
        run: |
          APP=$(find build/dd/Build/Products -name "LiqianApp.app" -type d | head -1)
          test -n "$APP" && test -x "$APP/LiqianApp"
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry liqian-native-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: liqian-native-unsigned-ipa
          path: liqian-native-unsigned.ipa
          if-no-files-found: error
