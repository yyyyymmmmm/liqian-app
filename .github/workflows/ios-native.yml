name: Build iOS (native, unsigned IPA)

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "App/**"
      - "Project.swift"
      - "Tuist.swift"
      - ".github/workflows/ios-native.yml"
  workflow_dispatch:

jobs:
  build-native:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Tuist
        run: brew install tuist

      - name: Generate project
        run: tuist generate --no-open

      - name: SwiftLint
        run: swiftlint lint --quiet || true

      - name: Build (no codesign)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Liqian.xcodeproj \
            -scheme LiqianApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build-full.log
          grep -E "error:|warning: .*deprecated|BUILD" build-full.log | head -60 || true

      - name: Unit tests (LiqianCore)
        run: |
          set -o pipefail
          xcodebuild test \
            -project Liqian.xcodeproj \
            -scheme LiqianApp \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:LiqianCoreTests \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-full.log
          grep -E "error:|Test Case|Executed|TEST" test-full.log | head -60 || true

      - name: Package unsigned IPA
        run: |
          APP=$(find build/dd/Build/Products -name "LiqianApp.app" -type d | head -1)
          test -n "$APP" && test -x "$APP/LiqianApp"
          echo "APP=$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry liqian-native-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: liqian-native-unsigned-ipa
          path: liqian-native-unsigned.ipa
          if-no-files-found: error
